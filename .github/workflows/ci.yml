name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests with coverage (80% line floor on src/)
        run: npm run test:coverage
      - run: npm run build

  # One job, never skipped: a skipped required check does not satisfy branch
  # protection. The paid subset runs only when prompts/** changed.
  # pull_request, never pull_request_target, so fork PRs get no secrets.
  eval-smoke:
    name: Eval smoke (5 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Report when this is not a pull request
        if: github.event_name != 'pull_request'
        run: echo "Not a pull_request. Eval smoke is a pull request gate and succeeds without calling Anthropic or Places."

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - id: detect
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          if git diff --name-only "FETCH_HEAD...HEAD" | grep -q '^prompts/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "prompts/** changed. Eval smoke will run 5 cases."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "prompts/** did not change. Eval smoke succeeds without calling Anthropic or Places."
          fi

      - name: Refuse fork PRs
        if: steps.detect.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::This PR changes prompts/** from a fork. The eval smoke subset needs repo secrets that forks cannot read. A maintainer must run 'npm run eval -- --limit 5' on a branch in this repo."
          exit 1

      - name: Require secrets
        if: steps.detect.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          missing=0
          for name in ANTHROPIC_API_KEY GOOGLE_PLACES_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repo secret $name is not set. This PR changes prompts/**, so the eval smoke subset is required and cannot be skipped."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.detect.outputs.changed == 'true'
        run: npm ci

      - name: Run eval smoke subset
        if: steps.detect.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ENABLE_LIVE_ROUTES: "true"
        run: npm run eval -- --limit 5 --out "$RUNNER_TEMP/eval-results"

      # The CLI exits 0 even when the quality gates fail, so check them here.
      - name: Check smoke gates
        if: steps.detect.outputs.changed == 'true'
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/eval-results/*.json)
          if [ "${#reports[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one eval report, found ${#reports[@]}."
            exit 1
          fi
          node -e '
            const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const gates = report.metrics?.gates;
            if (!gates) { console.error("::error::Report has no metrics.gates"); process.exit(1); }
            let failed = false;
            for (const [name, gate] of Object.entries(gates)) {
              console.log(`${gate.pass ? "PASS" : "FAIL"} ${name} (target ${gate.target})`);
              if (!gate.pass) { failed = true; console.error(`::error::Eval gate "${name}" failed`); }
            }
            process.exit(failed ? 1 : 0);
          ' "${reports[0]}"

      - name: Upload eval report
        if: always() && steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-report
          path: ${{ runner.temp }}/eval-results/*.json
          if-no-files-found: ignore
